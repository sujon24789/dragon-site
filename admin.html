<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragon Network - Admin Panel</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 20px; }
        .container { max-width: 900px; margin: auto; }
        h1, h2 { color: #38bdf8; margin-bottom: 15px; }
        .card { background: #1e293b; padding: 20px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #334155; }
        input, button, textarea { width: 100%; padding: 10px; margin: 8px 0; border-radius: 5px; border: none; font-size: 16px; }
        input, textarea { background: #0f172a; color: #fff; border: 1px solid #475569; }
        button { background: #0284c7; color: white; font-weight: bold; cursor: pointer; }
        button:hover { background: #0369a1; }
        #adminDashboard { display: none; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>

<div class="container">
    <div id="loginBox" class="card">
        <h2>Admin Login</h2>
        <input type="password" id="adminPass" placeholder="Enter Admin Password">
        <button onclick="login()">Access Panel</button>
        <p id="errMsg" style="color: #ef4444; display:none; margin-top:5px;">ভুল পাসওয়ার্ড!</p>
    </div>

    <div id="adminDashboard">
        <h1>Dragon Network Admin Panel</h1>

        <div class="card">
            <h2>📢 Update Live Notice</h2>
            <textarea id="noticeInput" rows="3" placeholder="Enter notice for users..."></textarea>
            <button onclick="updateNotice()">Post Notice</button>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyADJG4lXeMOJqbm11q5dG9KI3IxcpoXUs0",
      authDomain: "dragon-network-db5ba.firebaseapp.com",
      projectId: "dragon-network-db5ba",
      storageBucket: "dragon-network-db5ba.firebasestorage.app",
      messagingSenderId: "186488018721",
      appId: "1:186488018721:web:a8a5a85c51ede7b4be1060",
      databaseURL: "https://dragon-network-db5ba-default-rtdb.firebaseio.com/"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    function login() {
        const pass = document.getElementById('adminPass').value;
        if(pass === 'admin123') {
            document.getElementById('loginBox').style.display = 'none';
            document.getElementById('adminDashboard').style.display = 'block';
        } else {
            document.getElementById('errMsg').style.display = 'block';
        }
    }

    function updateNotice() {
        const noticeText = document.getElementById('noticeInput').value;
        if(noticeText) {
            database.ref('site/notice').set(noticeText).then(() => {
                alert('Notice Live Updated Successfully!');
                document.getElementById('noticeInput').value = '';
            }).catch(err => alert('Error: ' + err.message));
        }
    }
</script>

</body>
</html>
