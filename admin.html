<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragon Network - Admin Panel</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0b0f19; color: #f8fafc; font-family: Arial, sans-serif; padding: 20px; }
        .container { max-width: 500px; margin: auto; }
        .card { background: #1e293b; padding: 20px; border-radius: 10px; margin: 10px 0; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        button { padding: 6px 12px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .btn-approve { background: #10b981; color: white; }
        .btn-reject { background: #ef4444; color: white; margin-left: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h3>Pending Job Requests (Admin Panel)</h3>
            <div id="adminPendingJobs">Loading requests...</div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            databaseURL: "https://dragon-7e9b0-default-rtdb.firebaseio.com/"
        };
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        db.ref('pending_jobs').on('value', (snapshot) => {
            let adminDiv = document.getElementById('adminPendingJobs');
            adminDiv.innerHTML = "";

            if(!snapshot.exists()) {
                adminDiv.innerHTML = "<p>No pending job requests.</p>";
                return;
            }

            snapshot.forEach((childSnapshot) => {
                let jobId = childSnapshot.key;
                let job = childSnapshot.val();

                adminDiv.innerHTML += `
                    <div style="background:#0f172a; padding:12px; margin:8px 0; border-radius:6px; border:1px solid #334155;">
                        <p><b>Title:</b> ${job.title}</p>
                        <p style="color: #38bdf8; margin: 5px 0;"><b>Reward:</b> ${parseFloat(job.reward).toFixed(2)} USDT</p>
                        <button class="btn-approve" onclick="approveJobRequest('${jobId}', '${job.title}', ${job.reward})">Approve</button>
                        <button class="btn-reject" onclick="rejectJob('${jobId}')">Reject</button>
                    </div>
                `;
            });
        });

        function approveJobRequest(jobId, title, reward) {
            db.ref('jobs').push({
                title: title,
                reward: reward,
                timestamp: Date.now()
            }).then(() => {
                db.ref('pending_jobs/' + jobId).remove();
                alert("Job successfully approved and published to Micro Jobs!");
            });
        }

        function rejectJob(jobId) {
            db.ref('pending_jobs/' + jobId).remove().then(() => {
                alert("Job request rejected!");
            });
        }
    </script>
</body>
</html>
