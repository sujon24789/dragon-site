<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragon Network - Admin Panel</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; padding: 20px; text-align: center; }
        .card { background: #1e293b; padding: 20px; border-radius: 10px; margin: 10px auto; max-width: 450px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        button { background: #10b981; color: white; font-weight: bold; cursor: pointer; padding: 6px 12px; border: none; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="card">
        <h3>Pending Job Requests (Admin Panel)</h3>
        <div id="adminPendingJobs" style="text-align: left;">Loading requests...</div>
    </div>

    <script>
        const firebaseConfig = {
            databaseURL: "https://dragon-7e9b0-default-rtdb.firebaseio.com/"
        };
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        db.ref('pending_jobs/').on('value', (snapshot) => {
            let adminDiv = document.getElementById('adminPendingJobs');
            adminDiv.innerHTML = "";

            if(!snapshot.exists()) {
                adminDiv.innerHTML = "<p>কোনো পেন্ডিং জব রিকোয়েস্ট নেই।</p>";
                return;
            }

            snapshot.forEach((childSnapshot) => {
                let jobId = childSnapshot.key;
                let job = childSnapshot.val();

                adminDiv.innerHTML += `
                    <div style="background:#0f172a; padding:10px; margin:8px 0; border-radius:5px;">
                        <p><b>Title:</b> ${job.title}</p>
                        <p><b>Reward:</b> ${parseFloat(job.reward).toFixed(2)} USDT</p>
                        <button onclick="approveJobRequest('${jobId}', '${job.title}', ${job.reward})">Approve</button>
                        <button onclick="rejectJob('${jobId}')" style="background:#ef4444; margin-left:5px;">Reject</button>
                    </div>
                `;
            });
        });

        function approveJobRequest(jobId, title, reward) {
            db.ref('jobs/').push({
                title: title,
                reward: reward,
                timestamp: Date.now()
            }).then(() => {
                db.ref('pending_jobs/' + jobId).remove();
                alert("জব সফলভাবে অ্যাপ্রুভ করা হয়েছে!");
            });
        }

        function rejectJob(jobId) {
            db.ref('pending_jobs/' + jobId).remove().then(() => {
                alert("জব রিকোয়েস্ট রিজেক্ট করা হয়েছে!");
            });
        }
    </script>
</body>
</html>
