<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragon Network - Admin Panel</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 20px; }
        .container { max-width: 900px; margin: auto; }
        h1, h2 { color: #38bdf8; margin-bottom: 15px; }
        .card { background: #1e293b; padding: 20px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #334155; }
        input, button, textarea { width: 100%; padding: 10px; margin: 8px 0; border-radius: 5px; border: none; font-size: 16px; }
        input, textarea { background: #0f172a; color: #fff; border: 1px solid #475569; }
        button { background: #0284c7; color: white; font-weight: bold; cursor: pointer; }
        button:hover { background: #0369a1; }
        .btn-approve { background: #16a34a; width: auto; padding: 5px 15px; }
        .btn-reject { background: #dc2626; width: auto; padding: 5px 15px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #334155; }
        th { background: #0f172a; color: #38bdf8; }
        #adminDashboard { display: none; }
    </style>
</head>
<body>

<div class="container">
    <!-- Login Form -->
    <div id="loginBox" class="card">
        <h2>Admin Login</h2>
        <input type="password" id="adminPass" placeholder="Enter Admin Password">
        <button onclick="login()">Access Panel</button>
        <p id="errMsg" style="color: #ef4444; display:none; margin-top:5px;">ভুল পাসওয়ার্ড!</p>
    </div>

    <!-- Admin Dashboard -->
    <div id="adminDashboard">
        <h1>Dragon Network Admin Panel</h1>

        <!-- Notice Board -->
        <div class="card">
            <h2>📢 Update Live Notice</h2>
            <textarea id="noticeInput" rows="3" placeholder="Enter notice for users..."></textarea>
            <button onclick="updateNotice()">Post Notice</button>
        </div>

        <!-- Withdraw Requests -->
        <div class="card">
            <h2>💸 Pending Withdraw Requests</h2>
            <table>
                <thead>
                    <tr>
                        <th>User ID</th>
                        <th>Method</th>
                        <th>Amount</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="withdrawList">
                    <tr>
                        <td>#84920</td>
                        <td>bKash</td>
                        <td>500 BDT</td>
                        <td>
                            <button class="btn-approve" onclick="alert('Approved!')">Approve</button>
                            <button class="btn-reject" onclick="alert('Rejected!')">Reject</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // ডিফল্ট পাসওয়ার্ড: admin123
    function login() {
        const pass = document.getElementById('adminPass').value;
        if(pass === 'admin123') {
            document.getElementById('loginBox').style.display = 'none';
            document.getElementById('adminDashboard').style.display = 'block';
        } else {
            document.getElementById('errMsg').style.display = 'block';
        }
    }

    function updateNotice() {
        const notice = document.getElementById('noticeInput').value;
        if(notice) {
            alert('Notice Updated: ' + notice);
            document.getElementById('noticeInput').value = '';
        }
    }
</script>

</body>
</html>
