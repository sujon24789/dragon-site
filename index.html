<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragon Network - User Portal</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 20px; }
        .container { max-width: 500px; margin: auto; }
        h1 { color: #38bdf8; text-align: center; margin-bottom: 20px; }
        .card { background: #1e293b; padding: 25px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #334155; }
        .notice-box { background: #0284c7; color: white; padding: 12px; border-radius: 8px; margin-bottom: 20px; font-size: 14px; }
        input, button, textarea { width: 100%; padding: 12px; margin: 8px 0; border-radius: 6px; border: none; font-size: 15px; }
        input, textarea { background: #0f172a; color: #fff; border: 1px solid #475569; }
        button { background: #0284c7; color: white; font-weight: bold; cursor: pointer; margin-top: 12px; }
        button:hover { background: #0369a1; }
        .tab-buttons { display: flex; gap: 10px; margin-bottom: 15px; }
        .tab-buttons button { margin: 0; background: #334155; }
        .tab-buttons button.active { background: #0284c7; }
        .btn-success { background: #16a34a; }
        .btn-success:hover { background: #15803d; }
        .hidden { display: none; }
        .user-info { font-size: 16px; margin-bottom: 10px; line-height: 1.6; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>

<div class="container">
    <h1>🐲 Dragon Network</h1>

    <div class="notice-box">
        <strong>📢 নোটিশ: </strong> <span id="liveNotice">Loading...</span>
    </div>

    <div id="authBox" class="card">
        <div class="tab-buttons">
            <button id="tabLoginBtn" class="active" onclick="switchTab('login')">Login</button>
            <button id="tabRegBtn" onclick="switchTab('register')">Register</button>
        </div>

        <div id="loginForm">
            <h3>একাউন্টে লগইন করুন</h3>
            <input type="text" id="loginPhone" placeholder="মোবাইল নম্বর (Phone)">
            <input type="password" id="loginPass" placeholder="পাসওয়ার্ড (Password)">
            <button onclick="userLogin()">লগইন করুন</button>
        </div>

        <div id="regForm" class="hidden">
            <h3>নতুন একাউন্ট খুলুন</h3>
            <input type="text" id="regName" placeholder="আপনার নাম (Full Name)">
            <input type="text" id="regPhone" placeholder="মোবাইল নম্বর (Phone)">
            <input type="password" id="regPass" placeholder="পাসওয়ার্ড (Password)">
            <button class="btn-success" onclick="userRegister()">রেজিস্ট্রেশন করুন</button>
        </div>
    </div>

    <div id="userDashboard" class="card hidden">
        <h3>স্বাগতম, <span id="dashName" style="color:#38bdf8;"></span>!</h3>
        <div class="user-info">
            <p>📱 ফোন: <span id="dashPhone"></span></p>
            <p>💰 ব্যালেন্স: <strong>0 BDT</strong></p>
        </div>

        <hr style="border-color:#334155; margin: 15px 0;">

        <h3>অ্যাডমিনকে রিকোয়েস্ট পাঠান</h3>
        <textarea id="userMsg" rows="3" placeholder="আপনার রিকোয়েস্ট বা সমস্যার কথা লিখুন..."></textarea>
        <button class="btn-success" onclick="sendRequest()">রিকোয়েস্ট পাঠান</button>
        
        <button style="background:#dc2626; margin-top:20px;" onclick="logout()">লগআউট করুন</button>
    </div>
</div>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyADJG4lXeMOJqbm11q5dG9KI3IxcpoXUs0",
      authDomain: "dragon-network-db5ba.firebaseapp.com",
      projectId: "dragon-network-db5ba",
      storageBucket: "dragon-network-db5ba.firebasestorage.app",
      messagingSenderId: "186488018721",
      appId: "1:186488018721:web:a8a5a85c51ede7b4be1060",
      databaseURL: "https://dragon-network-db5ba-default-rtdb.firebaseio.com/"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    let currentUser = null;

    database.ref('site/notice').on('value', (snapshot) => {
        document.getElementById('liveNotice').innerText = snapshot.val() || 'Dragon Network-এ আপনাকে স্বাগতম!';
    });

    function switchTab(type) {
        if(type === 'login') {
            document.getElementById('loginForm').classList.remove('hidden');
            document.getElementById('regForm').classList.add('hidden');
            document.getElementById('tabLoginBtn').classList.add('active');
            document.getElementById('tabRegBtn').classList.remove('active');
        } else {
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('regForm').classList.remove('hidden');
            document.getElementById('tabLoginBtn').classList.remove('active');
            document.getElementById('tabRegBtn').classList.add('active');
        }
    }

    function userRegister() {
        const name = document.getElementById('regName').value.trim();
        const phone = document.getElementById('regPhone').value.trim();
        const pass = document.getElementById('regPass').value.trim();

        if(!name || !phone || !pass) {
            alert('সবগুলো ঘর পূরণ করুন!');
            return;
        }

        const userRef = database.ref('users/' + phone);
        userRef.once('value', (snapshot) => {
            if(snapshot.exists()) {
                alert('এই ফোন নম্বরে ইতিপূর্বে অ্যাকাউন্ট খোলা হয়েছে!');
            } else {
                userRef.set({
                    name: name,
                    phone: phone,
                    pass: pass,
                    joinedAt: Date.now()
                }).then(() => {
                    database.ref('requests').push({
                        username: name + " (" + phone + ")",
                        message: "নতুন অ্যাকাউন্ট রেজিস্টার করেছে",
                        timestamp: Date.now()
                    });

                    alert('রেজিস্ট্রেশন সফল হয়েছে! এখন লগইন করুন।');
                    switchTab('login');
                    document.getElementById('loginPhone').value = phone;
                });
            }
        });
    }

    function userLogin() {
        const phone = document.getElementById('loginPhone').value.trim();
        const pass = document.getElementById('loginPass').value.trim();

        if(!phone || !pass) {
            alert('ফোন নম্বর এবং পাসওয়ার্ড দিন!');
            return;
        }

        database.ref('users/' + phone).once('value', (snapshot) => {
            if(snapshot.exists()) {
                const userData = snapshot.val();
                if(userData.pass === pass) {
                    currentUser = userData;
                    showDashboard();
                } else {
                    alert('ভুল পাসওয়ার্ড!');
                }
            } else {
                alert('এই নম্বরে কোনো অ্যাকাউন্ট পাওয়া যায়নি!');
            }
        });
    }

    function showDashboard() {
        document.getElementById('authBox').classList.add('hidden');
        document.getElementById('userDashboard').classList.remove('hidden');
        document.getElementById('dashName').innerText = currentUser.name;
        document.getElementById('dashPhone').innerText = currentUser.phone;
    }

    function sendRequest() {
        const msg = document.getElementById('userMsg').value.trim();
        if(!msg) {
            alert('আপনার মেসেজ লিখুন!');
            return;
        }

        database.ref('requests').push({
            username: currentUser.name + " (" + currentUser.phone + ")",
            message: msg,
            timestamp: Date.now()
        }).then(() => {
            alert('আপনার রিকোয়েস্ট সফলভাবে পাঠানো হয়েছে!');
            document.getElementById('userMsg').value = '';
        });
    }

    function logout() {
        currentUser = null;
        document.getElementById('userDashboard').classList.add('hidden');
        document.getElementById('authBox').classList.remove('hidden');
        document.getElementById('loginPhone').value = '';
        document.getElementById('loginPass').value = '';
    }
</script>

</body>
</html>
