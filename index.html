<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragon Network - User Dashboard</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #0f172a; color: #fff; padding: 20px; text-align: center; }
        .card { background: #1e293b; padding: 20px; border-radius: 10px; margin: 10px auto; max-width: 400px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        input, button { width: 90%; padding: 10px; margin: 8px 0; border-radius: 5px; border: none; }
        button { background: #10b981; color: white; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="card">
        <h3>Post a New Job</h3>
        <input type="text" id="jobTitle" placeholder="Job Title (e.g. Subscribe Channel)">
        <input type="number" id="jobReward" placeholder="Reward Amount (USDT)" step="0.01">
        <button onclick="submitJob()">Submit Job</button>
    </div>

    <div class="card">
        <h3>Micro Jobs (Live)</h3>
        <div id="microJobList" style="text-align: left;">Loading jobs...</div>
    </div>

    <script>
        const firebaseConfig = {
            databaseURL: "https://dragon-7e9b0-default-rtdb.firebaseio.com/"
        };
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        function submitJob() {
            let title = document.getElementById('jobTitle').value;
            let reward = parseFloat(document.getElementById('jobReward').value);

            if(!title || isNaN(reward) || reward <= 0) {
                alert("সঠিকভাবে টাইটেল এবং রিওয়ার্ড দিন!");
                return;
            }

            db.ref('pending_jobs/').push({
                title: title,
                reward: reward,
                status: 'pending',
                timestamp: Date.now()
            }).then(() => {
                alert("জব রিকোয়েস্ট এডমিনের কাছে পাঠানো হয়েছে!");
                document.getElementById('jobTitle').value = "";
                document.getElementById('jobReward').value = "";
            });
        }                

        db.ref('jobs/').on('value', (snapshot) => {
            let jobListDiv = document.getElementById('microJobList');
            jobListDiv.innerHTML = "";
            
            if(!snapshot.exists()) {
                jobListDiv.innerHTML = "<p>কোনো মাইক্রো জব নেই।</p>";
                return;
            }

            snapshot.forEach((childSnapshot) => {
                let job = childSnapshot.val();
                jobListDiv.innerHTML += `
                    <div style="background:#0f172a; padding:10px; margin:5px 0; border-radius:5px;">
                        <h4>${job.title}</h4>
                        <p>Reward: <b>${parseFloat(job.reward).toFixed(2)} USDT</b></p>
                    </div>
                `;
            });
        });
    </script>
</body>
</html>
